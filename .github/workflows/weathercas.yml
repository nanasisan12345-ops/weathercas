name: WeatherCas collection and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weathercas-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL }}
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/Data/browsers
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Data/cache/python

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: mkdir -p Data/temp
      - run: python -m unittest discover -s tests -v
      - name: Collect official public metadata
        if: github.event_name != 'pull_request'
        id: collect
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          status = json.loads(Path('public/data/status.json').read_text())
          age = (now - datetime.fromisoformat(status['generated_at'])).total_seconds()
          live_only = os.environ['GITHUB_EVENT_NAME'] == 'schedule' and age < 10800
          raise SystemExit(subprocess.call(['python', '-m', 'collector.collect'] + (['--live-only'] if live_only else [])))
          PY
      - run: python -m collector.collect --validate-only
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - name: Build a new static directory
        run: npm run build -- --outDir release/pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: release/pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save data for the persistence job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collected-data
          path: public/data
          retention-days: 7
      - name: Retain collection and verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Data/logs/collector
            Data/verification
          retention-days: 7
          if-no-files-found: ignore
      - name: Report source health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('public/data/status.json')
          if not p.exists():
              raise SystemExit('status.json is missing')
          status = json.loads(p.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### WeatherCas collection\n')
              for source in status['sources']:
                  f.write(f"- {source['label']}: {source['status']} ({source['count']})\n")
          if not status['healthy']:
              print('::warning::Collection failed for one or more sources. Previous records are retained; see site status and artifact logs.')
          PY

  persist:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collected-data
          path: public/data
      - name: Commit only validated public metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update official WeatherCas metadata'
            git push origin HEAD:main
          fi

  deploy:
    needs: [build, persist]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
