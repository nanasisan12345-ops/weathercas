name: WeatherCas collection and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      archive_date:
        description: 'Optional past broadcast date to check (YYYY-MM-DD JST)'
        type: string

permissions:
  contents: read

concurrency:
  group: weathercas-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL }}
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/Data/browsers
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Data/cache/python

jobs:
  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Collect official public metadata
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ARCHIVE_DATE: ${{ inputs.archive_date }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          status = json.loads(Path('public/data/status.json').read_text())
          age = (now - datetime.fromisoformat(status['generated_at'])).total_seconds()
          live_only = os.environ['GITHUB_EVENT_NAME'] == 'schedule' and age < 10800
          args = ['python', '-m', 'collector.collect']
          if live_only:
              args.append('--live-only')
          if os.environ.get('ARCHIVE_DATE'):
              args.extend(['--archive-date', os.environ['ARCHIVE_DATE']])
          raise SystemExit(subprocess.call(args))
          PY
      - run: python -m collector.collect --validate-only
      - name: Share validated data with persistence and build jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collected-data
          path: public/data
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Retain collection logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: Data/logs/collector
          retention-days: 7
          if-no-files-found: ignore
      - name: Report source health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('public/data/status.json')
          if not p.exists():
              raise SystemExit('status.json is missing')
          status = json.loads(p.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### WeatherCas collection\n')
              for source in status['sources']:
                  f.write(f"- {source['label']}: {source['status']} ({source['count']})\n")
          if not status['healthy']:
              print('::warning::Collection failed for one or more sources. Previous records are retained; see status.json and collection logs.')
          PY

  build:
    needs: collect
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.collect.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.13'
      - name: Check collector and sample data for pull requests
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s tests -v
          python -m collector.collect --validate-only
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'pull_request'
        with:
          name: collected-data
          path: public/data
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: mkdir -p Data/temp
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - name: Build a new static directory
        env:
          VITE_LIVE_ENDPOINT: ${{ vars.LIVE_ENDPOINT }}
        run: npm run build -- --outDir release/pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: release/pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: Data/verification
          retention-days: 7
          if-no-files-found: ignore

  persist:
    needs: collect
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collected-data
          path: public/data
      - name: Commit only validated public metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update official WeatherCas metadata'
            git push origin HEAD:main
          fi

  deploy:
    needs: [build, persist]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
